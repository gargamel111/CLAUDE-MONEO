name: Compilar Descargador de Drive (Windows)

on:
  push:
    paths:
      - "descargador_drive/**"
      - ".github/workflows/descargador-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r descargador_drive/requirements.txt pyinstaller

      - name: Pruebas
        run: python -m unittest discover -s descargador_drive/tests -v

      - name: Probar que la ventana abre
        timeout-minutes: 3
        run: python descargador_drive/descargador_drive.py --smoke

      - name: Crear .exe
        run: pyinstaller --onefile --windowed --name DescargadorDrive --add-data "descargador_drive/ui;ui" --collect-all webview descargador_drive/descargador_drive.py

      - name: Probar que el .exe abre
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/DescargadorDrive.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El .exe no abrió bien (código $($p.ExitCode))" }
          Write-Host "El .exe abre bien"

      - uses: actions/upload-artifact@v4
        with:
          name: DescargadorDrive
          path: dist/DescargadorDrive.exe

      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se reutiliza el mismo release (en vez de borrarlo y crearlo) para
          # que el link de descarga nunca deje de funcionar.
          if gh release view descargador-drive > /dev/null 2>&1; then
            gh release upload descargador-drive dist/DescargadorDrive.exe --clobber
          else
            gh release create descargador-drive dist/DescargadorDrive.exe \
              --target "${{ github.sha }}" \
              --title "Descargador de Drive (última versión)" \
              --notes "Descarga DescargadorDrive.exe y ábrelo. No necesita instalación."
          fi
          gh release edit descargador-drive --draft=false --latest
          gh release view descargador-drive --json isDraft,assets --jq '"borrador=\(.isDraft) archivos=\([.assets[].name] | join(","))"'
